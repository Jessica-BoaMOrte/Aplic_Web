<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de candidatos - DISNEY</title>

    <link rel="stylesheet" href="style.css">

    <!-- Arquivo JavaScript do partido -->
    <script src="script.js"></script>
</head>

<body>

    <h1>Registro de Candidatos</h1>

    <!-- =============================== -->
    <!-- NÚMERO DO PARTIDO -->
    <!-- =============================== -->

    <div class="form-group">

        <label for="txtNumeroPartido">
            Número do Partido:
        </label>

        <input
            type="text"
            id="txtNumeroPartido"
            placeholder="Digite o número (ex: 91)"
            onchange="processarPartido()"
        >

        <span
            id="msgErroPartido"
            class="erro">
        </span>

    </div>


    <!-- =============================== -->
    <!-- NOME DO PARTIDO -->
    <!-- =============================== -->

    <div class="form-group">

        <label>
            Nome do Partido:
        </label>

        <span id="lblNomePartido">
            <b>---</b>
        </span>

    </div>


    <!-- =============================== -->
    <!-- CANDIDATO -->
    <!-- =============================== -->

    <div class="form-group">

        <label for="lstCandidatos">
            Candidato:
        </label>

        <select
            id="lstCandidatos"
            size="5"
            onchange="selecionarCandidato()">

            <!-- Os candidatos serão carregados pelo JavaScript -->

        </select>

    </div>


    <!-- =============================== -->
    <!-- CARGO -->
    <!-- =============================== -->

    <div class="form-group">

        <label for="lstCargos">
            Cargo a Concorrer:
        </label>

        <select
            id="lstCargos"
            size="5">

            <option value="Presidente">
                Presidente
            </option>

            <option value="Governador(a)">
                Governador(a)
            </option>

            <option value="Senador(a)">
                Senador(a)
            </option>

            <option value="Deputado(a) Federal">
                Deputado(a) Federal
            </option>

            <option value="Deputado(a) Estadual">
                Deputado(a) Estadual
            </option>

        </select>

    </div>


    <!-- =============================== -->
    <!-- NÚMERO DO CANDIDATO -->
    <!-- =============================== -->

    <div class="form-group">

        <label for="txtNumeroCandidato">
            Número do Candidato:
        </label>

        <input
            type="text"
            id="txtNumeroCandidato"
            placeholder="Informe o número do candidato"
        >

        <span class="rules">
            Regras: XX - Presidente/Governador(a);
            XXn - Senador(a);
            XXnn - Dep. Fed.;
            XXnnn - Dep. Est.
        </span>

        <span
            id="msgErroNumero"
            class="erro">
        </span>

    </div>


    <!-- =============================== -->
    <!-- BOTÕES -->
    <!-- =============================== -->

    <div class="actions">

        <button
            type="button"
            class="btn-primary"
            onclick="registrarCandidatura()">

            Registrar Candidatura

        </button>


        <button
            type="button"
            class="btn-success"
            onclick="gravarEEnviarTSE()">

            Gravar e Enviar ao TSE

        </button>

    </div>


    <!-- MENSAGEM DE FEEDBACK -->

    <span id="msgFeedbackAcao"></span>


    <hr>


    <!-- =============================== -->
    <!-- DADOS DO CANDIDATO -->
    <!-- =============================== -->

    <div
        id="painelCandidato"
        class="card-candidato"
        style="display: none;">

        <h3>
            Dados do Candidato Selecionado
        </h3>


        <p>
            <strong>Nome:</strong>

            <span id="infoNome">
                -
            </span>
        </p>


        <p>
            <strong>Cargo:</strong>

            <span id="infoCargo">
                -
            </span>
        </p>


        <p>
            <strong>Número:</strong>

            <span id="infoNumero">
                -
            </span>
        </p>


        <div>

            <strong>Foto:</strong>

            <br>

            <img
                id="infoFoto"
                src=""
                alt="Foto do Candidato"
                onerror="this.alt='Foto indisponível'"
            >

        </div>

    </div>


    <!-- =============================== -->
    <!-- CANDIDATURAS REGISTRADAS -->
    <!-- =============================== -->

    <h3>
        Candidaturas Registradas (Aguardando Envio)
    </h3>


    <ul id="listaRegistrados">

        <!--
            As candidaturas registradas
            aparecerão aqui pelo JavaScript.
        -->

    </ul>


    <!-- =============================== -->
    <!-- JAVASCRIPT DA PÁGINA -->
    <!-- =============================== -->

    <script>

        // Array que armazena as candidaturas
        // confirmadas pelo usuário.
        const registroCandidaturas = [];


        // Guarda o partido atualmente selecionado.
        let partidoAtual = null;


        // ==========================================
        // PROCESSAR PARTIDO
        // ==========================================

        async function processarPartido() {

            const numeroPartido =
                document
                    .getElementById("txtNumeroPartido")
                    .value
                    .trim();


            const msgErro =
                document.getElementById(
                    "msgErroPartido"
                );


            const nomePartido =
                document.getElementById(
                    "lblNomePartido"
                );


            const lista =
                document.getElementById(
                    "lstCandidatos"
                );


            // Limpa mensagens anteriores
            msgErro.textContent = "";

            lista.innerHTML = "";


            // Verifica se o número é válido
            if (
                !["91", "92", "93", "94"]
                    .includes(numeroPartido)
            ) {

                msgErro.textContent =
                    "Número de partido inválido.";

                nomePartido.innerHTML =
                    "<b>---</b>";

                return;
            }


            // ======================================
            // DISNEY = 91
            // ======================================

            if (numeroPartido !== "91") {

                msgErro.textContent =
                    "Para esta atividade, o partido configurado é a DISNEY (91).";

                nomePartido.innerHTML =
                    "<b>---</b>";

                return;
            }


            // Guarda informações do partido
            partidoAtual = {

                numero: "91",

                nome: "PDISNEY"

            };


            // Mostra o nome na tela
            nomePartido.innerHTML =
                "<b>DISNEY</b>";


            // Carrega os candidatos
            await carregarCandidatos();


            // Coloca os candidatos na lista
            candidatos.forEach(
                (candidato, indice) => {

                    const opcao =
                        document.createElement(
                            "option"
                        );


                    opcao.value = indice;

                    opcao.textContent =
                        candidato.nome;


                    lista.appendChild(
                        opcao
                    );

                }
            );

        }


        // ==========================================
        // SELECIONAR CANDIDATO
        // ==========================================

        function selecionarCandidato() {

            const lista =
                document.getElementById(
                    "lstCandidatos"
                );


            const indice =
                lista.value;


            // Nenhum candidato selecionado
            if (indice === "") {

                return;

            }


            const candidato =
                candidatos[indice];


            // Mostra o nome
            document.getElementById(
                "infoNome"
            ).textContent =
                candidato.nome;


            // Mostra a foto
            document.getElementById(
                "infoFoto"
            ).src =
                candidato.foto;


            // Limpa informações anteriores
            document.getElementById(
                "infoCargo"
            ).textContent = "-";


            document.getElementById(
                "infoNumero"
            ).textContent = "-";


            document.getElementById(
                "txtNumeroCandidato"
            ).value = "";


            // Mostra o painel
            document.getElementById(
                "painelCandidato"
            ).style.display = "block";


            // Se já foi registrado, mostra cargo e número
            const registrado =
                registroCandidaturas.find(
                    item =>
                        item.nome === candidato.nome
                );

            if (registrado) {

                document.getElementById(
                    "infoCargo"
                ).textContent = registrado.cargo;

                document.getElementById(
                    "infoNumero"
                ).textContent = registrado.numero;

            }

        }


        // ==========================================
        // REGISTRAR CANDIDATURA
        // ==========================================

        function registrarCandidatura() {

            const listaCandidatos =
                document.getElementById(
                    "lstCandidatos"
                );


            const listaCargos =
                document.getElementById(
                    "lstCargos"
                );


            const campoNumero =
                document.getElementById(
                    "txtNumeroCandidato"
                );


            const feedback =
                document.getElementById(
                    "msgFeedbackAcao"
                );


            const indice =
                listaCandidatos.value;


            const cargo =
                listaCargos.value;


            const numero =
                campoNumero.value.trim();


            // Limpa mensagem anterior
            feedback.textContent = "";

            feedback.style.color = "red";


            // ======================================
            // VERIFICA PARTIDO
            // ======================================

            if (!partidoAtual) {

                feedback.textContent =
                    "Informe o número do partido primeiro.";

                return;

            }


            // ======================================
            // VERIFICA CANDIDATO
            // ======================================

            if (indice === "") {

                feedback.textContent =
                    "Selecione um candidato.";

                return;

            }


            // ======================================
            // VERIFICA CARGO
            // ======================================

            if (cargo === "") {

                feedback.textContent =
                    "Selecione um cargo.";

                return;

            }


            // ======================================
            // VERIFICA NÚMERO
            // ======================================

            if (numero === "") {

                feedback.textContent =
                    "Informe o número do candidato.";

                return;

            }


            const candidato =
                candidatos[indice];


            // ======================================
            // IMPEDE CANDIDATO DUPLICADO
            // ======================================

            const jaRegistrado =
                registroCandidaturas.some(
                    item =>
                        item.nome === candidato.nome
                );


            if (jaRegistrado) {

                feedback.textContent =
                    "Este candidato já foi registrado anteriormente.";

                return;

            }


            // ======================================
            // VALIDA NÚMERO
            // ======================================

            if (
                !validarNumeroCandidato(
                    numero,
                    cargo
                )
            ) {

                feedback.textContent =
                    "Número inválido para o cargo selecionado.";

                return;

            }


            // ======================================
            // IMPEDE NÚMERO REPETIDO NO MESMO CARGO
            // (Presidente e Governador(a) usam o 91,
            //  por isso a checagem é por cargo)
            // ======================================

            const numeroRepetido =
                registroCandidaturas.some(
                    item =>
                        item.cargo === cargo &&
                        item.numero === numero
                );


            if (numeroRepetido) {

                feedback.textContent =
                    "Já existe um candidato com este número neste cargo.";

                return;

            }


            // ======================================
            // CONTA CANDIDATOS DO CARGO
            // ======================================

            const quantidade =
                registroCandidaturas.filter(
                    item =>
                        item.cargo === cargo
                ).length;


            // Presidente = máximo 1
            if (
                cargo === "Presidente" &&
                quantidade >= 1
            ) {

                feedback.textContent =
                    "O limite de Presidente já foi atingido.";

                return;

            }


            // Governador = máximo 1
            if (
                cargo === "Governador(a)" &&
                quantidade >= 1
            ) {

                feedback.textContent =
                    "O limite de Governador(a) já foi atingido.";

                return;

            }


            // Senador = máximo 2
            if (
                cargo === "Senador(a)" &&
                quantidade >= 2
            ) {

                feedback.textContent =
                    "O limite de Senadores já foi atingido.";

                return;

            }


            // ======================================
            // CRIA O REGISTRO
            // ======================================

            const registro = {

                nome: candidato.nome,

                numero: numero,

                foto: candidato.foto,

                cargo: cargo

            };


            // Adiciona ao array
            registroCandidaturas.push(
                registro
            );


            // Atualiza lista
            atualizarListaRegistrados();


            // Atualiza painel
            document.getElementById(
                "infoNome"
            ).textContent =
                candidato.nome;


            document.getElementById(
                "infoCargo"
            ).textContent =
                cargo;


            document.getElementById(
                "infoNumero"
            ).textContent =
                numero;


            document.getElementById(
                "infoFoto"
            ).src =
                candidato.foto;


            // Mensagem de sucesso
            feedback.style.color = "green";

            feedback.textContent =
                "Candidatura registrada com sucesso!";

        }


        // ==========================================
        // ATUALIZAR LISTA
        // ==========================================

        function atualizarListaRegistrados() {

            const lista =
                document.getElementById(
                    "listaRegistrados"
                );


            // Limpa a lista
            lista.innerHTML = "";


            // Adiciona cada candidato
            registroCandidaturas.forEach(
                candidato => {

                    const item =
                        document.createElement(
                            "li"
                        );


                    item.textContent =
                        `${candidato.nome} - ${candidato.cargo} - Nº ${candidato.numero}`;


                    lista.appendChild(
                        item
                    );

                }
            );

        }


        // ==========================================
        // GRAVAR E ENVIAR AO TSE
        // ==========================================

        function gravarEEnviarTSE() {

            const feedback =
                document.getElementById(
                    "msgFeedbackAcao"
                );


            // Precisa ter pelo menos uma candidatura
            if (
                registroCandidaturas.length === 0
            ) {

                feedback.style.color = "red";

                feedback.textContent =
                    "Nenhuma candidatura foi registrada.";

                return;

            }


            // Converte para JSON
            const jsonFinal =
                JSON.stringify(
                    registroCandidaturas,
                    null,
                    2
                );


            // Mostra no console
            console.log(
                "Dados enviados ao TSE:"
            );

            console.log(
                jsonFinal
            );


            // Guarda no localStorage
            localStorage.setItem(
                "PDISNEY",
                jsonFinal
            );


            // Cria o arquivo JSON
            const arquivo =
                new Blob(
                    [jsonFinal],
                    {
                        type:
                            "application/json"
                    }
                );


            const url =
                URL.createObjectURL(
                    arquivo
                );


            // Cria link para download
            const link =
                document.createElement(
                    "a"
                );


            link.href = url;

            link.download =
                "PDISNEY.json";


            document.body.appendChild(
                link
            );


            // Inicia download
            link.click();


            document.body.removeChild(
                link
            );


            URL.revokeObjectURL(
                url
            );


            // Mensagem final
            feedback.style.color =
                "green";


            feedback.textContent =
                "Chapa gravada e enviada ao TSE com sucesso!";

        }

    </script>

</body>

</html>
